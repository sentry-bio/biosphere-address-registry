[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosphere-address-registry"
version = "0.1.0"
description = "Content-addressed records for genomic map evidence and registered biosphere addresses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Sentry Bio", email = "research@sentry.bio"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4.18"]

[project.scripts]
bar = "biosphere_registry.cli:main"

[project.urls]
Repository = "https://github.com/sentry-bio/biosphere-address-registry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/biosphere-address-registry/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
